name: Vérification du site MajestiOS

on:
  push:
  pull_request:

# Éviter d’accumuler les tests obsolètes quand plusieurs corrections sont poussées rapidement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check catalogue-majestios.js
          node --check category-results.js
          node --check search-results.js
          node --check opportunity-search.js
          node --check rubric-search.js
          node --input-type=module --check < zone-artisanale.js
          node --check rubriques-immersives.js
      - name: Construire le site statique
        run: node build.js
      - name: Vérifier les pages, liens et parcours
        run: node verify-site.js
      - name: Vérifier le contrat commun de données CRM
        run: node tests/crm-result-contract.test.cjs
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Vérifier la connexion réelle à l’API BOAMP
        run: node tests/boamp-live-smoke.cjs
      - name: Vérifier la connexion réelle à l’API BODACC
        run: node tests/bodacc-live-smoke.cjs
      - name: Tester le moteur de recherche dans un vrai navigateur
        run: node tests/opportunity-search.browser.cjs
      - name: Tester la zone industrielle dans un vrai navigateur
        run: node tests/zone-artisanale.browser.cjs
