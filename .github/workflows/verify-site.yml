name: Vérification du site MajestiOS

on:
  push:
  pull_request:

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check catalogue-majestios.js
          node --check category-results.js
          node --check search-results.js
          node --input-type=module --check < zone-artisanale.js
          node --check rubriques-immersives.js
      - name: Construire le site statique
        run: node build.js
      - name: Vérifier les pages, liens et parcours
        run: node verify-site.js
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Tester la zone industrielle dans un vrai navigateur
        run: node tests/zone-artisanale.browser.cjs
