name: Application checks

on:
  push:
  pull_request:
    # Les PR de consolidation ne ciblent que les branches de référence.
    branches: [main, developpement]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit and API tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build application
        run: npm run build
