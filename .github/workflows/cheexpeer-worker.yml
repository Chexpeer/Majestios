name: Cheexpeer worker contract

on:
  push:
    branches: [Evolution-7]
    paths:
      - "services/cheexpeer-worker/**"
      - ".github/workflows/cheexpeer-worker.yml"
  pull_request:
    paths:
      - "services/cheexpeer-worker/**"
      - ".github/workflows/cheexpeer-worker.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        working-directory: services/cheexpeer-worker
        run: node --check src/index.mjs && node --check src/policy.mjs
      - name: Policy tests
        working-directory: services/cheexpeer-worker
        run: npm test
