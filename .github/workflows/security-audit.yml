name: Dependency security audit

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-audit.yml"
    branches: [architecture-v0-1]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate a temporary lockfile without changing dependency declarations
        run: npm install --package-lock-only --ignore-scripts
      - name: Run npm audit and save the full report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, advisories:Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via?.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Upload complete audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
