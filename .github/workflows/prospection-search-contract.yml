name: Tests du contrat serveur de Prospection

on:
  push:
    branches:
      - feature/crm-atomic-integration
      - Evolution-9
    paths:
      - "supabase/functions/_shared/prospection-search-core.mjs"
      - "supabase/functions/_shared/prospection-validation.mjs"
      - "supabase/functions/_shared/prospection-contract.mjs"
      - "tests/prospection-search-core.test.cjs"
      - "tests/prospection-form-contract.test.cjs"
      - "prospection-active.html"
      - "company-targeting.js"
      - "tests/company-targeting.test.cjs"
      - "tests/prospection-page-contract.test.cjs"
      - "qualification-entreprises.html"
      - "company-targeting-page.js"
      - "prospection-criteria-ux.js"
      - "company-targeting.js"
      - "prospection-active.html"
      - "tests/company-targeting.test.cjs"
      - "tests/prospection-page-contract.test.cjs"
      - "prospection-member-adapter.mjs"
      - "prospection-member-client.js"
      - "tests/prospection-member-adapter.test.cjs"
      - "tests/prospection-contract.test.cjs"
      - ".github/workflows/prospection-search-contract.yml"
  pull_request:
    paths:
      - "prospection-active.html"
      - "prospection-criteria-ux.js"
      - "company-targeting.js"
      - "company-targeting-page.js"
      - "tests/company-targeting.test.cjs"
      - "tests/prospection-page-contract.test.cjs"
      - "qualification-entreprises.html"
      - "tests/prospection-form-contract.test.cjs"
      - "prospection-member-adapter.mjs"
      - "prospection-member-client.js"
      - "tests/prospection-member-adapter.test.cjs"
      - "supabase/functions/_shared/prospection-search-core.mjs"
      - "supabase/functions/_shared/prospection-validation.mjs"
      - "supabase/functions/_shared/prospection-contract.mjs"
      - "tests/prospection-search-core.test.cjs"
      - "tests/prospection-contract.test.cjs"
      - ".github/workflows/prospection-search-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Tests unitaires du contrat et du moteur
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester le contrat DTO, validation et habilitations
        run: node tests/prospection-contract.test.cjs
      - name: Tester le moteur membre, les filtres et la pagination
        run: node tests/prospection-search-core.test.cjs
      - name: Vérifier la cohérence du formulaire de qualification
        run: node tests/prospection-form-contract.test.cjs
      - name: Tester le moteur public de ciblage et ses filtres
        run: node tests/company-targeting.test.cjs
      - name: Vérifier le raccordement du formulaire Prospection
        run: node tests/prospection-page-contract.test.cjs
      - name: Tester l’adaptateur authentifié de recherche membre
        run: node tests/prospection-member-adapter.test.cjs
