name: Validation technique MajestiOS

on:
  push:
    branches:
      - architecture-v0-1
  pull_request:
    branches:
      - main
      - architecture-v0-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier le lint
        run: npm run lint

      - name: Vérifier la compilation
        run: npm run build
