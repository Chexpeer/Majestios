name: Charger les marchés attribués (DECP)

# Télécharge le fichier public des marchés attribués (data.gouv.fr), garde les 6 derniers mois et les charge dans
# la base de production MajestiOS. Secrets requis (à poser par le propriétaire dans GitHub > Settings > Secrets and variables > Actions) :
#   SUPABASE_PROD_URL, SUPABASE_PROD_SERVICE_ROLE_KEY. Aucune clé n'est jamais écrite dans le dépôt ni affichée.
# Déclenchement : à la demande (Run workflow), chaque lundi (une fois fusionné sur la branche principale),
# ou lors d'un envoi qui modifie le script, ce workflow ou le fichier-déclencheur scripts/declencher-chargement-decp.txt.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [evolution-10]
    paths:
      - scripts/charger-decp.py
      - scripts/declencher-chargement-decp.txt
      - .github/workflows/charger-decp.yml

permissions:
  contents: read

concurrency:
  group: charger-decp
  cancel-in-progress: false

jobs:
  charger:
    name: Charger 6 mois de marchés attribués
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
      DECP_MONTHS: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer DuckDB
        run: pip install duckdb
      - name: Essai du script sur un faux fichier (sans secret)
        run: python tests/charger-decp.test.py
      - name: Vérifier les secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::Secrets SUPABASE_PROD_URL / SUPABASE_PROD_SERVICE_ROLE_KEY absents : chargement non lancé."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Secrets SUPABASE_PROD_URL / SUPABASE_PROD_SERVICE_ROLE_KEY manquants."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Charger les marchés attribués
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/charger-decp.py
