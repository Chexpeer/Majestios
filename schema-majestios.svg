<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240" role="img" aria-labelledby="title desc">
<title id="title">Schéma interactif MajestiOS</title>
<desc id="desc">Six surfaces géométriques colorées, aux contours noirs, avec des facettes triangulaires, disposées autour du centre à l’intérieur d’un cercle. Aucune rubrique n’est inscrite sur le schéma.</desc>
<defs><style>
.outline{fill:none;stroke:#171717;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
g[data-surface]{cursor:pointer;transition:filter .16s ease}
g[data-surface]:hover,g[data-surface]:focus,g[data-surface].selected{filter:brightness(1.07)}
g[data-surface]:focus{outline:none}
g[data-surface]:focus .outline,g[data-surface].selected .outline{stroke-width:5}
</style></defs>
<rect width="1240" height="1240" fill="#f7f5ed"/>
<circle cx="620" cy="614" r="566" fill="none" stroke="#c8c4b9" stroke-width="2"/>
<g data-surface="bleue" tabindex="0" role="button" aria-label="Sélectionner la surface bleue">
<polygon points="325,167 464,249 325,422" fill="#a8cff4"/>
<polygon points="325,167 613,331 464,249" fill="#b6d8f6"/>
<polygon points="464,249 613,331 613,583" fill="#397fc0"/>
<polygon points="325,422 464,249 464,583" fill="#6aa8e4"/>
<polygon points="325,422 464,583 613,583" fill="#5897d7"/>
<polygon class="outline" points="325,167 613,331 613,583 325,422"/>
</g>
<g data-surface="verte" tabindex="0" role="button" aria-label="Sélectionner la surface verte">
<polygon points="635,331 784,249 635,583" fill="#9fd3b1"/>
<polygon points="921,167 784,249 921,422" fill="#b5dfc2"/>
<polygon points="635,331 921,167 784,249" fill="#c0e4cb"/>
<polygon points="784,249 921,422 784,583" fill="#78bd91"/>
<polygon points="635,583 784,583 784,249" fill="#529f76"/>
<polygon class="outline" points="635,331 921,167 921,422 635,583"/>
</g>
<g data-surface="turquoise" tabindex="0" role="button" aria-label="Sélectionner la surface turquoise">
<polygon points="319,449 197,662 65,590" fill="#a3dfe3"/>
<polygon points="319,449 464,526 197,662" fill="#8bd2d8"/>
<polygon points="319,449 596,600 464,526" fill="#b8e6e8"/>
<polygon points="319,449 464,526 336,745" fill="#6dbdc5"/>
<polygon points="319,449 336,745 197,662" fill="#5aaeb6"/>
<polygon points="464,526 596,600 336,745" fill="#9adbe0"/>
<polygon class="outline" points="319,449 596,600 336,745 65,590"/>
</g>
<g data-surface="pêche" tabindex="0" role="button" aria-label="Sélectionner la surface pêche">
<polygon points="929,449 1060,526 913,745" fill="#f6ad8c"/>
<polygon points="929,449 1182,590 1060,526" fill="#f8c2a7"/>
<polygon points="1060,526 1182,590 913,745" fill="#f7a785"/>
<polygon points="929,449 913,745 782,662" fill="#e98768"/>
<polygon points="929,449 782,662 649,600" fill="#f5b294"/>
<polygon points="929,449 1060,526 913,745" fill="#ed9877" opacity=".7"/>
<polygon class="outline" points="929,449 1182,590 913,745 649,600"/>
</g>
<g data-surface="corail" tabindex="0" role="button" aria-label="Sélectionner la surface corail">
<polygon points="332,773 461,697 332,1038" fill="#f2a4ad"/>
<polygon points="332,773 613,617 461,697" fill="#f6b7bc"/>
<polygon points="461,697 613,617 613,878" fill="#d86c7a"/>
<polygon points="332,773 461,697 461,957" fill="#e77f8b"/>
<polygon points="461,957 613,878 613,617" fill="#eb8994"/>
<polygon points="332,1038 461,957 613,878 332,773" fill="#f0a0a8"/>
<polygon class="outline" points="332,773 613,617 613,878 332,1038"/>
</g>
