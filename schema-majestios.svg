<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 1216" width="1216" height="1216" role="img" aria-labelledby="title desc">
<title id="title">Schéma MajestiOS — six surfaces interactives</title>
<desc id="desc">Six formes séparées autour du centre, sur fond ivoire quadrillé et cercle fin. Chaque forme est divisée en trois triangles, avec deux couleurs alternées. Les six couleurs sont des tons pastel doux.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8cdbb" stroke-width="1" opacity=".45"/></pattern>
  <style>
    .outline{fill:none;stroke:#171717;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
    .seam{fill:none;stroke:#171717;stroke-width:1;opacity:.2}
    g[data-surface]{cursor:pointer;transition:filter .16s ease}
    g[data-surface]:hover,g[data-surface]:focus,g[data-surface].selected{filter:brightness(1.035)}
    g[data-surface]:focus{outline:none}
    g[data-surface]:focus .outline,g[data-surface].selected .outline{stroke-width:5}
  </style>
</defs>
<rect width="1216" height="1216" fill="#f7f5ed"/>
<rect width="1216" height="1216" fill="url(#grid)"/>
<circle cx="608" cy="608" r="562" fill="none" stroke="#c8c4b9" stroke-width="1.8"/>
<!-- Each petal is intentionally separated from the others; each has three triangular regions in A-B-A order. -->
<g id="surface-bleue" data-surface="bleue" tabindex="0" role="button" aria-label="Sélectionner la surface bleue">
  <polygon points="326,167 463,248 326,423" fill="#A8CFF2"/>
  <polygon points="463,248 326,423 613,583" fill="#B3DDB9"/>
  <polygon points="463,248 613,332 613,583" fill="#A8CFF2"/>
  <polygon class="outline" points="326,167 613,332 613,583 326,423"/>
  <path class="seam" d="M463 248L326 423M463 248L613 583"/>
</g>
<g id="surface-verte" data-surface="verte" tabindex="0" role="button" aria-label="Sélectionner la surface verte">
  <polygon points="921,167 784,248 921,423" fill="#B3DDB9"/>
  <polygon points="784,248 921,423 635,583" fill="#9AD9DE"/>
  <polygon points="784,248 635,332 635,583" fill="#B3DDB9"/>
  <polygon class="outline" points="921,167 635,332 635,583 921,423"/>
  <path class="seam" d="M784 248L921 423M784 248L635 583"/>
</g>
<g id="surface-turquoise" data-surface="violette" tabindex="0" role="button" aria-label="Sélectionner la surface turquoise">
  <polygon points="65,590 192,520 335,745" fill="#9AD9DE"/>
  <polygon points="192,520 335,745 597,599" fill="#A9BBD2"/>
  <polygon points="192,520 319,449 597,599" fill="#9AD9DE"/>
  <polygon class="outline" points="65,590 319,449 597,599 335,745"/>
  <path class="seam" d="M192 520L335 745M192 520L597 599"/>
</g>
<g id="surface-peche" data-surface="jaune" tabindex="0" role="button" aria-label="Sélectionner la surface pêche">
  <polygon points="1151,590 1040,520 912,745" fill="#F4B49A"/>
  <polygon points="1040,520 912,745 650,599" fill="#A8CFF2"/>
  <polygon points="1040,520 929,449 650,599" fill="#F4B49A"/>
  <polygon class="outline" points="1151,590 929,449 650,599 912,745"/>
  <path class="seam" d="M1040 520L912 745M1040 520L650 599"/>
</g>
<g id="surface-corail" data-surface="rouge" tabindex="0" role="button" aria-label="Sélectionner la surface corail">
  <polygon points="332,1038 461,957 332,773" fill="#EFA2AB"/>
  <polygon points="461,957 332,773 613,618" fill="#A9BBD2"/>
  <polygon points="461,957 613,875 613,618" fill="#EFA2AB"/>
  <polygon class="outline" points="332,1038 613,875 613,618 332,773"/>
  <path class="seam" d="M461 957L332 773M461 957L613 618"/>
</g>
<g id="surface-bleu-gris" data-surface="orange" tabindex="0" role="button" aria-label="Sélectionner la surface bleu-gris">
  <polygon points="916,1038 784,957 916,773" fill="#A9BBD2"/>
  <polygon points="784,957 916,773 635,618" fill="#F4B49A"/>
  <polygon points="784,957 635,875 635,618" fill="#A9BBD2"/>
  <polygon class="outline" points="916,1038 635,875 635,618 916,773"/>
  <path class="seam" d="M784 957L916 773M784 957L635 618"/>
</g>
</svg>