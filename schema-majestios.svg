<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">MajestiOS — schéma panoramique interactif</title>
<desc id="desc">Univers panoramique noir et or de MajestiOS. Douze surfaces interactives ouvrent les rubriques dédiées, organisées autour d’un emblème central couronné.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".45" stop-color="#cda85d"/><stop offset="1" stop-color="#80602b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18202b"/><stop offset="1" stop-color="#090d13"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#b48b42" stop-opacity=".24"/><stop offset="1" stop-color="#070a0f" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .bg{fill:#070a0f}.grid{stroke:#a88b4f;stroke-opacity:.09;stroke-width:1}.link{fill:none;stroke:#b99a59;stroke-opacity:.28;stroke-width:2;stroke-dasharray:5 9}
    .tile{cursor:pointer;outline:none;transition:filter .2s ease,opacity .2s ease}.tile .face{fill:url(#panel);stroke:#8e7544;stroke-opacity:.78;stroke-width:2}.tile .inner{fill:none;stroke:#f0d38b;stroke-opacity:.13;stroke-width:1}
    .tile:hover,.tile:focus,.tile.selected{filter:url(#glow)}.tile:hover .face,.tile:focus .face,.tile.selected .face{stroke:#f5d98e;stroke-opacity:1;stroke-width:3}.tile:focus{outline:none}
    .tile .number{font:600 15px system-ui,sans-serif;fill:#c6a867;letter-spacing:2px}.tile .label{font:600 22px system-ui,sans-serif;fill:#f5f0e5;text-anchor:middle}.tile .small{font:13px system-ui,sans-serif;fill:#a8a8a8;text-anchor:middle;letter-spacing:1px}
    .crown{fill:none;stroke:url(#gold);stroke-width:5;stroke-linejoin:round}.brand{font:700 78px Georgia,serif;fill:url(#gold);text-anchor:middle}.caption{font:600 16px system-ui,sans-serif;fill:#d8c18a;text-anchor:middle;letter-spacing:5px}.sub{font:14px system-ui,sans-serif;fill:#898b91;text-anchor:middle;letter-spacing:2px}
    .tile .hit{fill:transparent;stroke:transparent;pointer-events:all}
  </style>
</defs>
<rect class="bg" width="1600" height="1120"/>
<rect width="1600" height="1120" fill="url(#halo)"/>
<g class="grid" aria-hidden="true">
 <path d="M0 140H1600M0 280H1600M0 420H1600M0 560H1600M0 700H1600M0 840H1600M0 980H1600"/>
 <path d="M160 0V1120M320 0V1120M480 0V1120M640 0V1120M800 0V1120M960 0V1120M1120 0V1120M1280 0V1120M1440 0V1120"/>
</g>
<path class="link" d="M800 205V265M800 265L205 320M800 265L595 320M800 265L1005 320M800 265L1395 320M205 485V555M595 485V555M1005 485V555M1395 485V555M205 720V790M595 720V790M1005 720V790M1395 720V790"/>
<g aria-hidden="true">
 <path class="crown" d="M740 154L724 112L765 136L800 91L835 136L876 112L860 154Z"/>
 <path class="crown" d="M742 164H858L849 181H751Z"/>
 <text class="brand" x="800" y="242">M</text>
 <text class="caption" x="800" y="277">MAJESTIOS</text>
 <text class="sub" x="800" y="300">INTELLIGENCE COMMERCIALE PROACTIVE</text>
</g>
