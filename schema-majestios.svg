<title id="title">Schéma MajestiOS — six losanges, trois surfaces égales par losange</title>
<desc id="desc">Chaque losange comporte deux triangles aux extrémités de même couleur et une surface médiane d'une deuxième couleur. Les trois surfaces représentent chacune un tiers de l'aire du losange. Six couleurs sont utilisées dans l'ensemble.</desc>
