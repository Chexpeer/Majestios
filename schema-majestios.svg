<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 1124" width="924" height="1124" role="img" aria-labelledby="title desc">
<title id="title">Schéma MajestiOS — six surfaces interactives</title>
<desc id="desc">Six surfaces en forme de losange autour d’un centre commun. La géométrie et les positions reprennent le schéma de référence. Chaque surface est divisée en trois triangles d’aire égale, avec les deux triangles extérieurs de même couleur.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8cdbb" stroke-width="1" opacity=".38"/></pattern>
  <style>
    .outline{fill:none;stroke:#171717;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
    .seam{fill:none;stroke:#171717;stroke-width:1;opacity:.2}
    g[data-surface]{cursor:pointer;transition:filter .16s ease}
    g[data-surface]:hover,g[data-surface]:focus,g[data-surface].selected{filter:brightness(1.035)}
    g[data-surface]:focus{outline:none}
    g[data-surface]:focus .outline,g[data-surface].selected .outline{stroke-width:4.5}
  </style>
</defs>
<rect width="924" height="1124" fill="#f7f5ed"/>
<rect width="924" height="1124" fill="url(#grid)"/>
<circle cx="462" cy="562" r="475" fill="none" stroke="#c8c4b9" stroke-width="1.5"/>
<!-- Les six contours et leurs positions reprennent la géométrie de référence. Aucun texte n'est posé sur les surfaces. -->
<g id="surface-bleue" data-surface="bleue" tabindex="0" role="button" aria-label="Sélectionner la surface bleue">
  <polygon points="462,562 242,181 388.67,519.67" fill="#A8CFF2"/>
  <polygon points="242,181 388.67,519.67 315.33,477.33" fill="#B3DDB9"/>
  <polygon points="242,181 315.33,477.33 242,435" fill="#A8CFF2"/>
  <polygon class="outline" points="462,562 462,308 242,181 242,435"/>
  <path class="seam" d="M388.67 519.67L242 181M315.33 477.33L242 181"/>
</g>
<g id="surface-verte" data-surface="verte" tabindex="0" role="button" aria-label="Sélectionner la surface verte">
  <polygon points="462,562 682,181 535.33,519.67" fill="#B3DDB9"/>
  <polygon points="682,181 535.33,519.67 608.67,477.33" fill="#9AD9DE"/>
  <polygon points="682,181 608.67,477.33 682,435" fill="#B3DDB9"/>
  <polygon class="outline" points="462,562 462,308 682,181 682,435"/>
  <path class="seam" d="M535.33 519.67L682 181M608.67 477.33L682 181"/>
</g>
<g id="surface-violette" data-surface="violette" tabindex="0" role="button" aria-label="Sélectionner la surface violette">
  <polygon points="462,562 22.1,562 388.7,519.67" fill="#9AD9DE"/>
  <polygon points="22.1,562 388.7,519.67 315.4,604.33" fill="#A9BBD2"/>
  <polygon points="22.1,562 315.4,604.33 242,689" fill="#9AD9DE"/>
  <polygon class="outline" points="462,562 242,435 22.1,562 242,689"/>
  <path class="seam" d="M388.7 519.67L22.1 562M315.4 604.33L22.1 562"/>
</g>
<g id="surface-jaune" data-surface="jaune" tabindex="0" role="button" aria-label="Sélectionner la surface jaune">
  <polygon points="462,562 901.9,562 535.3,604.33" fill="#F4B49A"/>
  <polygon points="901.9,562 535.3,604.33 608.7,519.67" fill="#A8CFF2"/>
  <polygon points="901.9,562 608.7,519.67 682,435" fill="#F4B49A"/>
  <polygon class="outline" points="462,562 682,689 901.9,562 682,435"/>
  <path class="seam" d="M535.3 604.33L901.9 562M608.7 519.67L901.9 562"/>
</g>
<g id="surface-rouge" data-surface="rouge" tabindex="0" role="button" aria-label="Sélectionner la surface rouge">
  <polygon points="462,562 242,943 388.67,604.33" fill="#EFA2AB"/>
  <polygon points="242,943 388.67,604.33 315.33,646.67" fill="#A9BBD2"/>
  <polygon points="242,943 315.33,646.67 242,689" fill="#EFA2AB"/>
  <polygon class="outline" points="462,562 462,816 242,943 242,689"/>
  <path class="seam" d="M388.67 604.33L242 943M315.33 646.67L242 943"/>
</g>
<g id="surface-orange" data-surface="orange" tabindex="0" role="button" aria-label="Sélectionner la surface orange">
  <polygon points="462,562 682,943 535.33,604.33" fill="#A9BBD2"/>
  <polygon points="682,943 535.33,604.33 608.67,646.67" fill="#F4B49A"/>
  <polygon points="682,943 608.67,646.67 682,689" fill="#A9BBD2"/>
  <polygon class="outline" points="462,562 462,816 682,943 682,689"/>
  <path class="seam" d="M535.33 604.33L682 943M608.67 646.67L682 943"/>
</g>
</svg>