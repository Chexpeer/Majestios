<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 1124" width="924" height="1124" role="img" aria-labelledby="title desc">
<title id="title">Schéma MajestiOS — six surfaces interactives</title>
<desc id="desc">Six losanges disposés autour d’un centre commun, selon la géométrie de référence. Chaque losange est divisé en trois zones colorées d’aire égale. Aucun texte n’est posé sur les surfaces.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8cdbb" stroke-width="1" opacity=".38"/></pattern>
  <style>
    .outline{fill:none;stroke:#171717;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
    .seam{fill:none;stroke:#171717;stroke-width:1;opacity:.2}
    g[data-surface]{cursor:pointer;transition:filter .16s ease}
    g[data-surface]:hover,g[data-surface]:focus,g[data-surface].selected{filter:brightness(1.035)}
    g[data-surface]:focus{outline:none}
    g[data-surface]:focus .outline,g[data-surface].selected .outline{stroke-width:4.5}
  </style>
</defs>
<rect width="924" height="1124" fill="#f7f5ed"/>
<rect width="924" height="1124" fill="url(#grid)"/>
<circle cx="462" cy="562" r="475" fill="none" stroke="#c8c4b9" stroke-width="1.5"/>
<!-- Contours et placement calqués sur les six formes de référence. Les découpes sont des bandes d’aire égale. -->
<g id="surface-bleue" data-surface="bleue" tabindex="0" role="button" aria-label="Sélectionner la surface bleue">
  <polygon points="462,562 462,477.33 242,350.33 242,435" fill="#A8CFF2"/>
  <polygon points="462,477.33 462,392.67 242,265.67 242,350.33" fill="#B3DDB9"/>
  <polygon points="462,392.67 462,308 242,181 242,265.67" fill="#A8CFF2"/>
  <polygon class="outline" points="462,562 462,308 242,181 242,435"/>
  <path class="seam" d="M462 477.33L242 350.33M462 392.67L242 265.67"/>
</g>
<g id="surface-verte" data-surface="verte" tabindex="0" role="button" aria-label="Sélectionner la surface verte">
  <polygon points="462,562 462,477.33 682,350.33 682,435" fill="#B3DDB9"/>
  <polygon points="462,477.33 462,392.67 682,265.67 682,350.33" fill="#9AD9DE"/>
  <polygon points="462,392.67 462,308 682,181 682,265.67" fill="#B3DDB9"/>
  <polygon class="outline" points="462,562 462,308 682,181 682,435"/>
  <path class="seam" d="M462 477.33L682 350.33M462 392.67L682 265.67"/>
</g>
<g id="surface-turquoise" data-surface="turquoise" tabindex="0" role="button" aria-label="Sélectionner la surface turquoise">
  <polygon points="462,562 388.67,519.67 168.77,646.67 242,689" fill="#9AD9DE"/>
  <polygon points="388.67,519.67 315.4,477.33 95.5,604.33 168.77,646.67" fill="#A9BBD2"/>
  <polygon points="315.4,477.33 242,435 22.1,562 95.5,604.33" fill="#9AD9DE"/>
  <polygon class="outline" points="462,562 242,435 22.1,562 242,689"/>
  <path class="seam" d="M388.67 519.67L168.77 646.67M315.4 477.33L95.5 604.33"/>
</g>
<g id="surface-pêche" data-surface="pêche" tabindex="0" role="button" aria-label="Sélectionner la surface pêche">
  <polygon points="462,562 535.33,604.33 755.23,477.33 682,435" fill="#F4B49A"/>
  <polygon points="535.33,604.33 608.6,646.67 828.5,519.67 755.23,477.33" fill="#A8CFF2"/>
  <polygon points="608.6,646.67 682,689 901.9,562 828.5,519.67" fill="#F4B49A"/>
  <polygon class="outline" points="462,562 682,689 901.9,562 682,435"/>
  <path class="seam" d="M535.33 604.33L755.23 477.33M608.6 646.67L828.5 519.67"/>
</g>
<g id="surface-ardoise" data-surface="ardoise" tabindex="0" role="button" aria-label="Sélectionner la surface ardoise">
  <polygon points="462,562 462,646.67 242,773.67 242,689" fill="#EFA2AB"/>
  <polygon points="462,646.67 462,731.33 242,858.33 242,773.67" fill="#A9BBD2"/>
  <polygon points="462,731.33 462,816 242,943 242,858.33" fill="#EFA2AB"/>
  <polygon class="outline" points="462,562 462,816 242,943 242,689"/>
  <path class="seam" d="M462 646.67L242 773.67M462 731.33L242 858.33"/>
</g>
<g id="surface-corail" data-surface="corail" tabindex="0" role="button" aria-label="Sélectionner la surface corail">
  <polygon points="462,562 462,646.67 682,773.67 682,689" fill="#A9BBD2"/>
  <polygon points="462,646.67 462,731.33 682,858.33 682,773.67" fill="#F4B49A"/>
  <polygon points="462,731.33 462,816 682,943 682,858.33" fill="#A9BBD2"/>
  <polygon class="outline" points="462,562 462,816 682,943 682,689"/>
  <path class="seam" d="M462 646.67L682 773.67M462 731.33L682 858.33"/>
</g>
</svg>