 <polygon class="face" points="1235,605 1265,580 1525,580 1555,605 1555,730 1525,755 1265,755 1235,730"/><polygon class="inner" points="1246,611 1271,592 1519,592 1544,611 1544,724 1519,743 1271,743 1246,724"/>
 <text class="number" x="1265" y="624">08 / ÉCOSYSTÈME</text><text class="label" x="1395" y="667">Sous-traitance</text><text class="small" x="1395" y="697">CAPTER LES DÉBORDEMENTS</text><polygon class="hit" points="1235,605 1265,580 1525,580 1555,605 1555,730 1525,755 1265,755 1235,730"/>
