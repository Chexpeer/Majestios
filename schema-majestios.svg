<polygon points="635,617 784,697 635,878" fill="#b8c8dc"/>
<polygon points="635,617 913,773 784,697" fill="#a9bbd3"/>
<polygon points="784,697 913,773 784,957" fill="#93a8c4"/>
<polygon points="635,617 784,697 784,957" fill="#8197b4"/>
<polygon points="635,878 784,957 913,1038" fill="#b9c8da"/>
<polygon points="635,878 784,957 913,773" fill="#9fb2cb"/>
<polygon class="outline" points="635,617 913,773 913,1038 635,878"/>
</g>
</svg>